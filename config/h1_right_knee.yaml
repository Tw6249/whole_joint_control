robot: H1
domain_id: 0
network_interface: eth0
control_dt: 0.002
mock_duration: 5.0
log_path: h1_mock_log.csv

safe_hold:
  kp: 10.0
  kd: 1.0
  lowstate_timeout: 0.05

controller:
  target_joint: 2
  kp: 65.0
  kd: 15.0
  observer_gain_q: 0.25
  observer_gain_dq: 0.25
  filter_alpha: 0.5
  policy_reference_dt: 0.05
  ref_center: 0.75
  ref_amplitude: 0.55
  ref_frequency: 0.8
  ref_phase: -1.5707963267948966
  startup_ramp_duration: 4.0
  eid_tau_limit: 12.0
  eid_tau_slew_rate: 60.0
  torque_safe_kp: 0.0
  torque_safe_kd: 0.8
  # 0.0 selects the build_simulink_base_model.m defaults:
  # inverse_q_weight = 0.5/(dt*dt), inverse_dq_weight = 1.0.
  inverse_q_weight: 0.0
  inverse_dq_weight: 0.0

plant:
  Jeff: 0.238
  b: 1.0
  gravityA: 4.2835
  gravityB: 0.0
  tau0: -0.2711
  q_min: -0.26
  q_max: 2.05
  tau_max: 12.0

